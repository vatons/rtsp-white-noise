name: Validate

on:
  push:
  pull_request:
  # Weekly, so a Home Assistant release that breaks something shows up
  # before anyone updates to it.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The integration tests need Home Assistant, which installs on Linux.
      - run: pip install pytest-homeassistant-custom-component
      - run: python -m pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Brand icons live in home-assistant/brands, which only matters
          # for HACS's default list - not a custom repository.
          ignore: brands
